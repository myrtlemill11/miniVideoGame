<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/style_page.css">
    <meta charset="UTF-8">
    <title>Shopping Frenzy</title>
    <script src="javascript/users.js"></script>
</head>

<body>
    <div>
        <!-- Navigation Bar -->
        <h1 class="title"><b>Shopping Frenzy</b></h1>
        <ul id="navigation_bar">

            <li>
                <a href="index.html">
                    <button class="navButton">Login</button>
                </a>
            </li>
            <li>
                <a href="register.html">
                    <button class="navButton">Register</button>
                </a>
            </li>
            <li>
                <a href="game.html">
                    <button class="navButton">Game</button>
                </a>
            </li>
            <li>
                <a href="rankings.html">
                    <button class="navButton">Rankings</button>
                </a>
            </li>
        </ul>
        <!-- Input login information -->
        <nav class="input">
            <div>
                <h2>Login</h2>
            </div>
            <div>
                <p>Username
                    <input id="username" type="Username" value="Username">
                </p>
            </div>

            <div>
                <p>Password
                    <input id="password" type="Password" value="Password">
                </p>
            </div>

            <div>
                <button id="loginButton" class="button" onclick="login()">Submit</button>
            </div>
            <div id="feedback">
                <p>No account? Register here!</p>
                <a href="register.html">
                    <button class="button">Register</button>
                </a>
            </div>
        </nav>
        <!-- Grocery-trolley cart image -->
        <img id="Grocery" src="images/Grocery.png" alt="Grocery">
        <!-- Link to register page -->
        <div class="link_to_other_pages">
            <p>Don't have an account? Click here to register!</p>
            <a href="register.html">
                <button class="button">Register</button>
            </a>

    </div>
</body>

</html>
